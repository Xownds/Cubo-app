<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Configuração para funcionar corretamente em celulares -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Cubo - Etapa 1</title>

    <!-- Carrega o Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Carrega o código principal do jogo -->
    <script type="module" src="./src/main.js"></script>

    <style>
        /*
         * Remove margens e faz o jogo
         * ocupar toda a tela.
         */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }

        /*
         * Impede espaços extras ao redor
         * do canvas criado pelo Phaser.
         */
        canvas {
            display: block;
        }
    </style>
</head>

</html>
